apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: book-service-monitor
  labels:
    release: kube-monitoring
spec:
  selector:
    matchLabels:
      app: book-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - default

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/*.log
      pos_file /var/log/fluentd.pos
      tag logs
      <parse>
        @type none
      </parse>
    </source>

    <match **>
      @type elasticsearch
      host elasticsearch-master.logging.svc.cluster.local
      port 9200
      scheme http
      logstash_format true
      logstash_prefix fluentd
    </match>

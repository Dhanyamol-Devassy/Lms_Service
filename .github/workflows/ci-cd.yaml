name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          docker build -t user-service ./user-service
          docker build -t book-service ./book-service
          docker build -t borrowing-service ./borrowing-service

      - name: Load Images into Minikube
        run: |
          minikube image load user-service
          minikube image load book-service
          minikube image load borrowing-service

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/user-service/
          kubectl apply -f k8s/book-service/
          kubectl apply -f k8s/borrowing-service/

      - name: Perform Rolling Update (example)
        run: |
          kubectl rollout restart deployment/user-service
